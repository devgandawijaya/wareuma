<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Wareuma Premium</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; background-color: #f8f9fa; }
    .auth-card {
      max-width: 450px;
      margin: 60px auto;
      padding: 30px;
      border-radius: 10px;
      background-color: white;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .auth-card h2 { color: green; font-weight: bold; margin-bottom: 25px; text-align: center; }
    .form-control:focus { box-shadow: none; border-color: green; }
    .btn-auth {
      background-color: green;
      color: white;
      font-weight: bold;
      width: 100%;
    }
    .btn-auth:hover { background-color: #006400; }
    .text-center a { color: green; text-decoration: none; }
    .text-center a:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="auth-card">
  <h2>Daftar Akun</h2>
  <form>
    <div class="mb-3">
      <label for="name" class="form-label">Nama Lengkap</label>
      <input type="text" class="form-control" id="name" placeholder="Nama Anda" required>
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email" placeholder="contoh@email.com" required>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" placeholder="Buat password" required>
    </div>
    <div class="mb-3">
      <label for="confirmPassword" class="form-label">Konfirmasi Password</label>
      <input type="password" class="form-control" id="confirmPassword" placeholder="Ulangi password" required>
    </div>
    <button type="submit" class="btn btn-auth">Daftar</button>
  </form>
  <p class="text-center mt-3">Sudah punya akun? <a href="login.html">Login</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
