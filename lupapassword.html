<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Password - Wareuma Premium</title>
  <link href="assets/site.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; background-color: #f8f9fa; }
    .auth-card {
      max-width: 400px;
      margin: 80px auto;
      padding: 30px;
      border-radius: 10px;
      background-color: white;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .auth-card h2 { color: green; font-weight: bold; margin-bottom: 25px; text-align: center; }
    .form-control:focus { box-shadow: none; border-color: green; }
    .btn-auth {
      background-color: green;
      color: white;
      font-weight: bold;
      width: 100%;
    }
    .btn-auth:hover { background-color: #006400; }
    .text-center a { color: green; text-decoration: none; }
    .text-center a:hover { text-decoration: underline; }
  </style>

<!-- Page Loader -->
<div class="page-loader" id="pageLoader" aria-hidden="true">
  <div class="loader-leaf"></div>
  <div class="loader-text">Sedang memuat...</div>
</div>
</head>
<body>

<div class="auth-card">
  <h2>Lupa Password</h2>
  <form>
    <div class="mb-3">
      <label for="email" class="form-label">Masukkan Email Anda</label>
      <input type="email" class="form-control" id="email" placeholder="contoh@email.com" required>
    </div>
    <button type="submit" class="btn btn-auth">Kirim Link Reset</button>
  </form>
  <p class="text-center mt-3"><a href="login.html">Kembali ke Login</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  window.addEventListener("load", function () {
    const loader = document.getElementById("pageLoader");
    if (loader) loader.classList.add("loaded");
  });
</script>
</body>
</html>
