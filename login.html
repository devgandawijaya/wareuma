<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Wareuma Premium</title>
  <link href="assets/site.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: Arial, sans-serif; background-color: #f8f9fa; }
    .login-card {
      max-width: 400px;
      margin: 80px auto;
      padding: 30px;
      border-radius: 10px;
      background-color: white;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .login-card h2 { color: green; font-weight: bold; margin-bottom: 25px; text-align: center; }
    .form-control:focus { box-shadow: none; border-color: green; }
    .btn-login {
      background-color: green;
      color: white;
      font-weight: bold;
      width: 100%;
    }
    .btn-login:hover {
      background-color: #006400;
      color: white;
    }
    .forgot-password { font-size: 0.9rem; text-align: right; display: block; margin-top: 5px; }
    .text-center a { color: green; text-decoration: none; }
    .text-center a:hover { text-decoration: underline; }
  </style>

<!-- Page Loader -->
<div class="page-loader" id="pageLoader" aria-hidden="true">
  <div class="loader-leaf"></div>
  <div class="loader-text">Sedang memuat...</div>
</div>
</head>
<body>

<div class="login-card">
  <h2>Login</h2>
  <form>
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email" placeholder="Masukkan email" required>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" placeholder="Masukkan password" required>
      <a href="lupapassword.html" class="forgot-password">Lupa password?</a>
    </div>
    <button type="submit" class="btn btn-login">Login</button>
  </form>
  <p class="text-center mt-3">Belum punya akun? <a href="register.html">Daftar</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  window.addEventListener("load", function () {
    const loader = document.getElementById("pageLoader");
    if (loader) loader.classList.add("loaded");
  });
</script>
</body>
</html>
